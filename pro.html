<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nicómaco · pro</title>
    <link rel="icon" type="image/png" href="icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F8F5EF;
            --text: #3d3529;
            --text-bright: #1D1D1F;
            --comment: #86868B;
            --gold: #B8960C;
            --font-serif: 'Cormorant Garamond', Georgia, serif;
            --font-sans: 'Inter', system-ui, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-serif);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
        }
        .container {
            max-width: 440px;
            width: 100%;
            text-align: center;
        }
        .header-name {
            font-family: var(--font-serif);
            font-size: 22px;
            font-weight: 400;
            color: var(--text-bright);
            letter-spacing: -0.3px;
            margin-bottom: 48px;
        }
        .message {
            font-size: 22px;
            line-height: 1.6;
            color: var(--text);
            margin-bottom: 48px;
            font-style: italic;
        }
        .sep {
            width: 40px;
            height: 1px;
            background: var(--gold);
            margin: 0 auto 48px;
        }
        .detail {
            font-family: var(--font-sans);
            font-size: 13px;
            line-height: 1.8;
            color: var(--comment);
            margin-bottom: 48px;
            letter-spacing: 0.2px;
        }
        .detail span {
            display: block;
            color: var(--text);
            font-weight: 500;
        }
        .price-block {
            margin-bottom: 32px;
        }
        .price {
            font-size: 42px;
            font-weight: 300;
            color: var(--text-bright);
            letter-spacing: -1px;
        }
        .price-currency {
            font-size: 20px;
            font-weight: 400;
            color: var(--comment);
        }
        .price-period {
            font-family: var(--font-sans);
            font-size: 12px;
            color: var(--comment);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 4px;
        }
        .btn-subscribe {
            display: block;
            width: 100%;
            max-width: 280px;
            margin: 0 auto 24px;
            background: var(--text-bright);
            color: var(--bg);
            border: none;
            border-radius: 40px;
            padding: 16px 32px;
            font-family: var(--font-sans);
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: opacity 0.2s;
            text-decoration: none;
        }
        .btn-subscribe:hover { opacity: 0.85; }
        .note {
            font-family: var(--font-sans);
            font-size: 11px;
            color: var(--comment);
            margin-bottom: 40px;
        }
        .back {
            font-family: var(--font-sans);
            font-size: 12px;
            color: var(--comment);
            text-decoration: none;
            letter-spacing: 1px;
        }
        .back:hover { color: var(--text); }
        .sig {
            margin-top: 60px;
            font-family: var(--font-sans);
            font-size: 10px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--comment);
        }
        .success-msg {
            font-size: 20px;
            line-height: 1.6;
            font-style: italic;
            color: var(--text);
            margin: 32px 0;
        }
    </style>
</head>
<body>
    <div class="container" id="main-content">
        <div class="header-name">nicómaco</div>

        <p class="message" id="msg-main"></p>

        <div class="sep"></div>

        <div class="detail" id="detail-block"></div>

        <div class="price-block">
            <div class="price" id="price-display">···</div>
            <div class="price-period" id="price-period"></div>
        </div>

        <a href="#" class="btn-subscribe" id="btn-checkout"></a>

        <p class="note" id="note-text"></p>

        <a href="/" class="back" id="back-link"></a>

        <div class="sig">Α  ΕΣΤΙΝ  Α</div>
    </div>

    <script>
    const WORKER = 'https://nicomaco-api.joseandv.workers.dev';
    const lang = localStorage.getItem('vu_lang') || (navigator.language?.startsWith('es') ? 'es' : 'en');
    const es = lang === 'es';

    // i18n
    const txt = es ? {
        msg: 'Cada pregunta te convierte en alguien que piensa con mas claridad.<br>Pro te deja seguir entrenando.',
        f1title: 'entrena tu pensamiento',
        f1sub: 'consultas ilimitadas — cada analisis fortalece tu capacidad de detectar premisas, contradicciones y conceptos robados',
        f2title: 'arquitectura del yo',
        f2sub: 'una conversacion guiada que construye tu retrato filosofico — y cada analisis futuro mide si vives de acuerdo a tu diseño',
        f3title: 'tu evolucion visible',
        f3sub: 'bitacora, racha, muro de decisiones, evolucion de tus preguntas — evidencia medible de que estas pensando diferente',
        f4title: 'el espejo',
        f4sub: 'detecta patrones en tus preguntas, contradicciones en el tiempo, y las dimensiones de tu vida que evitas examinar',
        f5title: 'modo reverso',
        f5sub: 'nicomaco te presenta una afirmacion y tu la analizas — el momento donde demuestras que aprendiste a pensar',
        period: 'al mes',
        btn: 'continuar',
        note: 'cancela cuando quieras · pago seguro via stripe',
        back: '← nicómaco',
        successTitle: 'tu suscripcion esta activa',
        successMsg: 'El espejo esta listo.<br>El diseño te espera.',
        successBtn: 'ir a nicómaco',
        successNote: 'recibiras un email de confirmacion de stripe',
        canceled: 'pago cancelado · puedes intentar de nuevo cuando quieras',
    } : {
        msg: 'Every question turns you into someone who thinks more clearly.<br>Pro lets you keep training.',
        f1title: 'train your thinking',
        f1sub: 'unlimited queries — every analysis strengthens your ability to detect premises, contradictions, and stolen concepts',
        f2title: 'architecture of the self',
        f2sub: 'a guided conversation that builds your philosophical portrait — and every future analysis measures if you are living according to your design',
        f3title: 'your evolution, visible',
        f3sub: 'log, streaks, decision wall, question evolution — measurable evidence that you are thinking differently',
        f4title: 'the mirror',
        f4sub: 'detects patterns in your questions, contradictions over time, and the dimensions of your life you avoid examining',
        f5title: 'reverse mode',
        f5sub: 'nicomaco presents a claim and you analyze it — the moment where you prove you learned to think',
        period: 'per month',
        btn: 'continue',
        note: 'cancel anytime · secure payment via stripe',
        back: '← nicómaco',
        successTitle: 'your subscription is active',
        successMsg: 'The mirror is ready.<br>Your design awaits.',
        successBtn: 'go to nicómaco',
        successNote: 'you will receive a confirmation email from stripe',
        canceled: 'payment canceled · you can try again anytime',
    };

    // Check for success/cancel
    const params = new URLSearchParams(window.location.search);
    if (params.get('success') === 'true') {
        document.getElementById('main-content').innerHTML = `
            <div class="header-name">nicómaco</div>
            <div class="sep" style="margin-top:0"></div>
            <p class="success-msg">${txt.successTitle}<br>${txt.successMsg}</p>
            <a href="/" class="btn-subscribe" style="margin-top:32px">${txt.successBtn}</a>
            <p class="note" style="margin-top:16px">${txt.successNote}</p>
            <div class="sig">Α  ΕΣΤΙΝ  Α</div>
        `;
    } else if (params.get('canceled') === 'true') {
        render();
        document.getElementById('note-text').textContent = txt.canceled;
    } else {
        render();
    }

    function render() {
        document.getElementById('msg-main').innerHTML = txt.msg;
        document.getElementById('detail-block').innerHTML = `
            <span>${txt.f1title}</span>${txt.f1sub}<br><br>
            <span>${txt.f2title}</span>${txt.f2sub}<br><br>
            <span>${txt.f3title}</span>${txt.f3sub}<br><br>
            <span>${txt.f4title}</span>${txt.f4sub}<br><br>
            <span>${txt.f5title}</span>${txt.f5sub}
        `;
        document.getElementById('price-period').textContent = txt.period;
        document.getElementById('btn-checkout').textContent = txt.btn;
        document.getElementById('note-text').textContent = txt.note;
        document.getElementById('back-link').textContent = txt.back;

        // Fetch geo pricing
        fetch(`${WORKER}/api/geo`).then(r => r.json()).then(data => {
            const sym = data.currency === 'USD' ? '$' : '$';
            document.getElementById('price-display').innerHTML =
                `${data.price} <span class="price-currency">${data.currency}</span>`;
        }).catch(() => {
            document.getElementById('price-display').innerHTML =
                `9 <span class="price-currency">USD</span>`;
        });
    }

    // Checkout
    document.getElementById('btn-checkout')?.addEventListener('click', async (e) => {
        e.preventDefault();
        const btn = e.target;
        btn.textContent = es ? 'conectando...' : 'connecting...';
        btn.style.opacity = '0.6';
        try {
            const headers = { 'Content-Type': 'application/json' };
            const token = localStorage.getItem('vu_auth_token');
            if (token) headers['Authorization'] = `Bearer ${token}`;
            const res = await fetch(`${WORKER}/api/create-checkout`, {
                method: 'POST',
                headers,
            });
            const data = await res.json();
            if (data.url) {
                window.location.href = data.url;
            } else {
                throw new Error(data.error || (es ? 'error al crear sesion de pago' : 'error creating payment session'));
            }
        } catch (err) {
            btn.textContent = txt.btn;
            btn.style.opacity = '1';
            alert('Error: ' + err.message);
        }
    });
    </script>
</body>
</html>
